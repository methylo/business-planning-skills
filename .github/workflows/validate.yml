name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bizplan-kstartup-pitch/package-lock.json
      - run: npm ci
        working-directory: bizplan-kstartup-pitch
      - run: npm test
        working-directory: bizplan-kstartup-pitch
      - run: node tests/test_pitch_validation.js
      - run: node tests/test_pitch_runtime.js /tmp/business-planning-skills-pitch-test.pptx
      - run: python3 tests/verify_pptx.py /tmp/business-planning-skills-pitch-test.pptx
      - run: python3 scripts/build_packages.py
      - run: python3 -m unittest tests/test_repository.py -v
      - run: git diff --exit-code -- packages
